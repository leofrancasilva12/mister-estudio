services:
  estudio:
    build: .
    restart: unless-stopped
    env_file: .env
    # Sem "ports": o app NÃO fica aberto para a internet. Só o Caddy fala com ele.
    expose:
      - "3000"

  # MCP do Estúdio: deixa o Claude gerar imagens e vídeos com o Kie.ai
  estudio-mcp:
    build: ./mcp
    restart: unless-stopped
    environment:
      MODO: http
      HOST: 0.0.0.0
      PORTA: 3333
      MCP_TOKEN: ${MCP_TOKEN}
      HOSTS_PERMITIDOS: ${DOMINIO}
      PROVEDOR: ${MCP_PROVEDOR:-kie}
      KIE_API_KEY: ${KIE_API_KEY}
      MCP_LIMITE_CREDITOS_DIA: ${MCP_LIMITE_CREDITOS_DIA:-600}
    expose:
      - "3333"
    mem_limit: 256m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - estudio
      - estudio-mcp

volumes:
  caddy_dados:
  caddy_config:
