# Mister Studio MCP: o conector do Claude para gerar imagens e vídeos com o Kie.ai, com HTTPS.
# Ligar: docker compose up -d --build
# O site antigo está guardado no ramo "site-final" do GitHub.

services:
  estudio-mcp:
    build: ./mcp
    restart: unless-stopped
    environment:
      MODO: http
      HOST: 0.0.0.0
      PORTA: 3333
      MCP_TOKEN: ${MCP_TOKEN}
      HOSTS_PERMITIDOS: ${DOMINIO}
      PROVEDOR: ${MCP_PROVEDOR:-kie}
      KIE_API_KEY: ${KIE_API_KEY}
      MCP_LIMITE_CREDITOS_DIA: ${MCP_LIMITE_CREDITOS_DIA:-600}
    volumes:
      - mcp_dados:/dados
    expose:
      - "3333"
    mem_limit: 256m

  # Mister Pesquisa MCP: pesquisa na web com fontes (Perplexity Sonar via OpenRouter)
  pesquisa-mcp:
    build: ./pesquisa
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORTA: 3334
      PESQUISA_TOKEN: ${PESQUISA_TOKEN}
      HOSTS_PERMITIDOS: ${DOMINIO}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      PESQUISA_LIMITE_USD_DIA: ${PESQUISA_LIMITE_USD_DIA:-2}
    expose:
      - "3334"
    mem_limit: 128m

  # Mister Video MCP: transcrição de vídeos do YouTube (grátis, sem chave de API)
  video-mcp:
    build: ./video
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORTA: 3335
      VIDEO_TOKEN: ${VIDEO_TOKEN}
      HOSTS_PERMITIDOS: ${DOMINIO}
    expose:
      - "3335"
    mem_limit: 128m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - estudio-mcp
      - pesquisa-mcp
      - video-mcp

volumes:
  caddy_dados:
  caddy_config:
  mcp_dados:
